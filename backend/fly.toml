app = "faithful-violet-707"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  WEB_ROOT = "/srv/site"
  DATABASE_PATH = "/data/paradiso.db"
  TOKEN_TTL_HOURS = "12"
  ALLOWED_ORIGINS = "https://loungebarparadiso.it,https://www.loungebarparadiso.it,https://faithful-violet-707.fly.dev"
  BOOKING_EMAIL_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzd0ZEddVWO3gwgnD08PbNH_Yh4D5A1REOhCMGEp75DyxXWaVxxMtZtcQ79geN1mx1s/exec"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "paradiso_data"
  destination = "/data"
  initial_size = "1gb"
