name: Deploy site and API to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: paradiso-fly-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FLY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Configure Firebase Cloud Messaging
        run: |
          flyctl secrets set \
            FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            FIREBASE_CREDENTIALS_JSON="$FIREBASE_CREDENTIALS_JSON" \
            --app faithful-violet-707
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      - name: Deploy the unified site and API container
        run: flyctl deploy --remote-only --config backend/fly.toml --dockerfile backend/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
